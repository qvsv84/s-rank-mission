<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>S Rank — Daily Mission</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010107}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none}
#space{
 position:relative;width:100%;height:100%;overflow:hidden;
 background:radial-gradient(circle at 50% 50%,rgba(255,55,160,.10),transparent 27%),
 radial-gradient(circle at 50% 50%,#080812 0,#020207 58%,#000 100%);
}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* ---------- Star field ---------- */
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(255,255,255,.9)}
@keyframes twinkle{from{opacity:.18}to{opacity:var(--op)}}

/* ---------- Question ---------- */
#questionWrap{
 position:absolute;left:50%;top:36%;z-index:10;width:min(92vw,650px);
 transform:translate(-50%,-50%);text-align:center;
}
#counter{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.45);margin-bottom:16px}
#question{
 color:#fff;font-size:clamp(25px,7vw,54px);font-weight:750;line-height:1.18;
 text-shadow:0 0 6px #fff,0 0 18px #ff4fa3,0 0 42px #ff4fa3;
 cursor:pointer;user-select:none;transition:opacity .35s,transform .35s;
 animation:breathe 2.8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* ---------- Wheel ---------- */
#wheelArea{
 position:absolute;left:50%;top:65%;z-index:20;
 width:min(88vw,390px);height:250px;
 transform:translate(-50%,-50%);
 opacity:0;pointer-events:none;transition:opacity .35s;
}
#wheelArea.show{opacity:1;pointer-events:auto}
#wheelViewport{
 position:absolute;inset:0;overflow:hidden;border-radius:28px;
 background:linear-gradient(to bottom,rgba(0,0,0,.93),rgba(15,5,14,.32) 50%,rgba(0,0,0,.93));
 border:1px solid rgba(255,255,255,.10);
 box-shadow:inset 0 0 35px rgba(255,60,160,.08);
}
#selectionLine{
 position:absolute;left:8%;right:8%;top:50%;height:58px;
 transform:translateY(-50%);
 border-top:1px solid rgba(255,105,185,.6);
 border-bottom:1px solid rgba(255,105,185,.6);
 background:rgba(255,70,165,.055);border-radius:14px;
 z-index:3;pointer-events:none;
}
#items{position:absolute;left:0;right:0;top:0;height:100%}
.item{
 position:absolute;left:0;right:0;height:58px;
 display:flex;align-items:center;justify-content:center;
 color:rgba(255,255,255,.22);font-size:21px;font-weight:650;
 transform-origin:center;user-select:none;
}
.item.selected{
 color:#fff;text-shadow:0 0 6px #fff,0 0 17px #ff4fa3,0 0 35px #ff4fa3;
}
#wheelHint{
 position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);
 color:rgba(255,255,255,.38);font-size:12px;white-space:nowrap;
}
#confirm{
 position:absolute;left:50%;bottom:-91px;transform:translateX(-50%);
 min-width:130px;min-height:46px;padding:10px 22px;border-radius:999px;
 border:1px solid rgba(255,255,255,.25);
 background:linear-gradient(135deg,#ff3c91,#ff70b9);
 color:#fff;font-size:15px;font-weight:700;
 box-shadow:0 0 20px rgba(255,50,145,.45);
 opacity:0;pointer-events:none;transition:opacity .25s;
}
#confirm.show{opacity:1;pointer-events:auto}

/* ---------- Messages ---------- */
#message{
 position:absolute;inset:0;z-index:30;
 display:flex;align-items:center;justify-content:center;
 padding:25px;text-align:center;pointer-events:none;
 color:#fff;font-weight:800;font-size:clamp(28px,7.5vw,62px);line-height:1.12;
 text-shadow:0 0 8px #fff,0 0 25px #ff4fa3,0 0 65px #ff4fa3;
 opacity:0;transform:scale(.6);
}
#message.show{animation:messageIn .85s cubic-bezier(.16,.9,.25,1) forwards}
@keyframes messageIn{
 0%{opacity:0;transform:scale(.35);filter:blur(14px)}
 60%{opacity:1;transform:scale(1.08);filter:blur(0)}
 100%{opacity:1;transform:scale(1)}
}
#message .small{display:block;font-size:.42em;font-weight:500;margin-top:16px;color:rgba(255,255,255,.68)}
.heart{
 position:absolute;left:50%;top:50%;z-index:25;pointer-events:none;
 color:#ff397f;font-size:22px;text-shadow:0 0 8px #ff397f,0 0 22px #ff397f;
 animation:fly var(--time) ease-out forwards;
}
@keyframes fly{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
 12%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(var(--s))}
}
.flash{
 position:absolute;left:50%;top:50%;z-index:24;width:8px;height:8px;border-radius:50%;
 background:#fff;box-shadow:0 0 20px #fff,0 0 60px #ff4fa3,0 0 120px #ff4fa3;
 transform:translate(-50%,-50%);animation:flash .75s ease-out forwards;
}
@keyframes flash{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(42)}}
#hint{
 position:absolute;left:50%;bottom:7%;transform:translateX(-50%);
 color:rgba(255,255,255,.38);font-size:12px;z-index:10;white-space:nowrap;
}

/* ===== CHECKLIST ===== */
#checklistPanel{
  position:absolute;left:50%;top:50%;z-index:9999;
  width:min(90vw,460px);max-height:82vh;
  transform:translate(-50%,-50%) scale(.94);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s,transform .45s;
}
#checklistPanel.show{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}
#checklistTitle{
  text-align:center;color:#fff;font-size:clamp(24px,6vw,36px);
  font-weight:800;margin-bottom:6px;
  text-shadow:0 0 10px #fff,0 0 28px #ff4fa3;
}
#checklistSub{
  text-align:center;color:rgba(255,255,255,.5);
  font-size:12px;margin-bottom:14px;
}
#checklistScroll{
  max-height:65vh;overflow:auto;border-radius:20px;
  scrollbar-width:none;
}
#checklistScroll::-webkit-scrollbar{display:none}
#checklist{
  width:100%;border-collapse:separate;border-spacing:0;
  border:1px solid rgba(255,255,255,.14);border-radius:20px;
  overflow:hidden;background:rgba(8,4,12,.78);
  backdrop-filter:blur(14px);
}
#checklist th,#checklist td{
  padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.07);
}
#checklist th{
  color:rgba(255,255,255,.48);font-size:11px;
  letter-spacing:1.2px;text-transform:uppercase;
}
#checklist th:last-child,#checklist td:last-child{
  text-align:center;width:78px;
}
#checklist tr:last-child td{border-bottom:0}
.playerName{color:rgba(255,255,255,.8);font-size:14px;font-weight:600}
.checkBox{
  width:25px;height:25px;border-radius:8px;margin:auto;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
}
.checkBox.checked{
  border-color:#ff70b9;
  background:linear-gradient(135deg,#ff3c91,#ff70b9);
  box-shadow:0 0 15px rgba(255,55,155,.65);
  animation:checkPop .55s cubic-bezier(.16,.9,.25,1);
}
.checkBox.checked::after{
  content:"✓";color:#fff;font-size:17px;font-weight:900;
}
#checklist tr.completed{
  animation:rowGlow .8s ease forwards;
}
@keyframes checkPop{
  0%{transform:scale(.3);opacity:.2}
  65%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
@keyframes rowGlow{
  0%{background:rgba(255,70,165,0)}
  45%{background:rgba(255,70,165,.14)}
  100%{background:rgba(255,70,165,.04)}
}

</style>
</head>
<body>
<main id="space">
 <canvas id="stars"></canvas>

 <div id="questionWrap">
   <div id="counter">CÂU 1</div>
   <div id="question">Tên bạn là gì?</div>
 </div>

 <div id="wheelArea">
   <div id="wheelViewport">
     <div id="selectionLine"></div>
     <div id="items"></div>
   </div>
   <div id="wheelHint">Vuốt lên / xuống để chọn</div>
   <button id="confirm" type="button">Xác nhận ❤️</button>
 </div>

 <div id="message"></div>

<section id="checklistPanel">
  <div id="checklistTitle">Checklist nhiệm vụ</div>
  <div id="checklistSub">Danh sách người chơi</div>
  <div id="checklistScroll">
    <table id="checklist">
      <thead><tr><th>Người chơi</th><th>Hoàn thành</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

 <div id="hint">Chạm vào câu hỏi</div>
</main>

<script>
(() => {
  const names=[
    "Tiến Lợi","Mỹ Dung","Phạm Kim Chi","Kim Chi","Quỳnh Trang",
    "Minh Thuỳ","Phương Thảo","Thảo Uyên","Minh Thư","Như Dương",
    "Rosalie","Tuan Nguyen","Minh Quân","Huong Lye"
  ];

  /* Đáp án câu 1 theo yêu cầu: v = Tiến Lợi */
  const correctName="Tiến Lợi";

  // Google Sheets / Apps Script
  const API_URL="https://script.google.com/macros/s/AKfycbyU8-X8ySl_fNn1iBeoJHQNtQnzk6-aU5ndEDKvV8lJoMGUsR8mhoy4mE8ApoqZTv2u/exec";
  let serverStatus={};

  async function loadChecklistFromSheet() {
    try {
      const res=await fetch(API_URL, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const rows=await res.json();
      serverStatus={};
      rows.forEach(item=>{
        // API mới chỉ trả name + time.
        // API cũ có completed:true.
        // Hỗ trợ cả hai để checklist luôn đồng bộ.
        if(item && item.name){
          serverStatus[item.name] =
            item.completed === true ||
            !!item.time;
        }
      });
      refreshChecklist();
    } catch(err) {
      console.warn("Không đọc được Google Sheets:",err);
    }
  }

  async function saveCompletion(name, completed=true) {
    // completed=true: tạo bản ghi hôm nay.
    // completed=false: xoá hẳn bản ghi hôm nay.
    if(completed){
      serverStatus[name] = true;
    }else{
      delete serverStatus[name];
    }
    refreshChecklist();

    try {
      await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({name, completed:!!completed}),
        mode:"no-cors"
      });
      return true;
    } catch(err) {
      console.warn("Không đồng bộ được Google Sheets:", err);
      return false;
    }
  }

  // Tự làm mới checklist khi sang ngày mới (00:00).
  function scheduleDailyReset(){
    const now=new Date();
    const next=new Date(now);
    next.setHours(24,0,0,50);
    const delay=Math.max(1000,next-now);
    setTimeout(async()=>{
      serverStatus={};
      refreshChecklist();
      await loadChecklistFromSheet();
      scheduleDailyReset();
    },delay);
  }

  const root=document.getElementById("space");
  const canvas=document.getElementById("stars");
  const ctx=canvas.getContext("2d",{alpha:true});
  const question=document.getElementById("question");
  const counter=document.getElementById("counter");
  const wheelArea=document.getElementById("wheelArea");
  const itemsBox=document.getElementById("items");
  const confirm=document.getElementById("confirm");
  const hint=document.getElementById("hint");
  const message=document.getElementById("message");
  const checklistPanel=document.getElementById("checklistPanel");
  const checklistBody=document.querySelector("#checklist tbody");

  names.forEach((name,i)=>{
    const tr=document.createElement("tr");
    tr.dataset.index=i;
    tr.innerHTML=`
      <td class="playerName">${name}</td>
      <td><div class="checkBox" aria-label="Chưa hoàn thành"></div></td>
    `;
    checklistBody.appendChild(tr);
  });

  function refreshChecklist(flashIndex=-1){
    [...checklistBody.querySelectorAll("tr")].forEach((tr,i)=>{
      const done=!!serverStatus[names[i]];
      tr.classList.toggle("completed",done);
      const box=tr.querySelector(".checkBox");
      box.classList.toggle("checked",done);
      box.setAttribute("aria-label",done?"Đã hoàn thành":"Chưa hoàn thành");
      if(done && i===flashIndex){
        box.classList.remove("checked");
        void box.offsetWidth;
        box.classList.add("checked");
      }
    });
  }

  function showChecklist(completedIndex=-1){
    checklistPanel.style.display="block";
    checklistPanel.style.visibility="visible";
    checklistPanel.style.opacity="1";
    checklistPanel.style.pointerEvents="auto";
    checklistPanel.classList.add("show");
    refreshChecklist(completedIndex);
    const row=completedIndex>=0 ? checklistBody.querySelector(`tr[data-index="${completedIndex}"]`) : null;
    if(row) setTimeout(()=>row.scrollIntoView({block:"center",behavior:"smooth"}),150);
  }



  /* =========================
     SAO 3D CỐ ĐỊNH + QUAY QUANH TÂM
  ========================= */
  let W=innerWidth,H=innerHeight,DPR=1;
  const stars=[];
  const STAR_COUNT=180;

  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener("resize",resize,{passive:true});resize();

  for(let i=0;i<STAR_COUNT;i++){
    stars.push({
      angle:Math.random()*Math.PI*2,
      radius:.38+Math.random()*.9,
      tilt:(Math.random()-.5)*1.5,
      speed:.00010+Math.random()*.00016,
      size:.45+Math.random()*1.7,
      phase:Math.random()*Math.PI*2,
      alpha:.2+Math.random()*.75
    });
  }

  function drawStars(time){
    ctx.clearRect(0,0,W,H);
    const cx=W*.5,cy=H*.5,base=Math.min(W,H);

    for(const s of stars){
      const a=s.angle+time*s.speed;
      const orbitX=base*(.72+s.radius*.20);
      const orbitY=base*(.25+s.radius*.16);
      const x=Math.cos(a)*orbitX,y=Math.sin(a)*orbitY;
      const yy=y*Math.cos(s.tilt)-x*.12*Math.sin(s.tilt);
      const xx=x*Math.cos(s.tilt)+y*.12*Math.sin(s.tilt);
      const z=(Math.sin(a)+1)/2;
      const perspective=.48+z*.85;
      const px=cx+xx*perspective,py=cy+yy*perspective;
      const alpha=s.alpha*(.72+.28*Math.sin(time*.002+s.phase))*(.25+z*.75);
      const size=s.size*(.55+z*1.45);

      ctx.beginPath();ctx.arc(px,py,size,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,245,252,${alpha})`;
      ctx.shadowColor="rgba(255,110,190,.9)";ctx.shadowBlur=3+z*7;ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  /* =========================
     WHEEL CÂU 1
  ========================= */
  const ITEM_H=58;
  names.forEach((name)=>{
    const el=document.createElement("div");
    el.className="item";el.textContent=name;itemsBox.appendChild(el);
  });

  let current=0;
  let dragging=false,startY=0,dragOffset=0;

  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));

  function renderWheel(){
    const mid=wheelArea.clientHeight/2;
    [...itemsBox.children].forEach((el,i)=>{
      const y=(i-current)*ITEM_H+mid+dragOffset;
      const distance=Math.abs(y-mid);
      const normalized=clamp(distance/(ITEM_H*2.3),0,1);
      const scale=1-normalized*.28;
      const opacity=.20+(1-normalized)*.80;
      el.style.top=(y-ITEM_H/2)+"px";
      el.style.transform=`scale(${scale})`;
      el.style.opacity=opacity;
      el.style.filter=`blur(${normalized*2.5}px)`;
      el.classList.toggle("selected",i===current&&Math.abs(dragOffset)<ITEM_H*.35);
    });
  }

  function snap(){
    if(Math.abs(dragOffset)>ITEM_H*.35){
      current+=dragOffset<0?1:-1;
      current=clamp(current,0,names.length-1);
    }
    dragOffset=0;renderWheel();confirm.classList.add("show");
  }

  wheelArea.addEventListener("pointerdown",e=>{
    dragging=true;startY=e.clientY;dragOffset=0;
    wheelArea.setPointerCapture?.(e.pointerId);
  });
  wheelArea.addEventListener("pointermove",e=>{
    if(!dragging)return;
    dragOffset=e.clientY-startY;
    if((current===0&&dragOffset>0)||(current===names.length-1&&dragOffset<0))dragOffset*=.25;
    renderWheel();
  });
  wheelArea.addEventListener("pointerup",()=>{if(dragging){dragging=false;snap()}});
  wheelArea.addEventListener("pointercancel",()=>{if(dragging){dragging=false;snap()}});

  /* =========================
     HIỆU ỨNG
  ========================= */
  function burst(){
    const f=document.createElement("div");f.className="flash";root.appendChild(f);
    setTimeout(()=>f.remove(),800);

    for(let i=0;i<32;i++){
      const h=document.createElement("div");
      h.className="heart";h.textContent=i%5===0?"💗":"♥";
      const a=Math.PI*2*i/32,r=80+Math.random()*220;
      h.style.setProperty("--x",Math.cos(a)*r+"px");
      h.style.setProperty("--y",Math.sin(a)*r+"px");
      h.style.setProperty("--r",(Math.random()*120-60)+"deg");
      h.style.setProperty("--s",(0.7+Math.random()*1.3).toFixed(2));
      h.style.setProperty("--time",(0.75+Math.random()*.7).toFixed(2)+"s");
      root.appendChild(h);setTimeout(()=>h.remove(),1700);
    }
  }

  function showMessage(html,duration=3000,next=null){
    wheelArea.classList.remove("show");
    question.style.opacity="0";
    hint.textContent="";
    message.innerHTML=html;
    message.classList.remove("show");
    void message.offsetWidth;
    message.classList.add("show");
    burst();

    if(next){
      setTimeout(()=>{
        message.classList.remove("show");
        setTimeout(next,300);
      },duration);
    }
  }

  /* Câu 1 */
  let q1Opened=false;
  function openQuestion1(e){
    if(e) e.preventDefault();
    if(q1Opened) return;
    q1Opened=true;
    question.style.pointerEvents="none";
    question.style.opacity="0";
    question.style.transform="scale(.8)";
    burst();
    setTimeout(()=>{
      wheelArea.classList.add("show");
      renderWheel();
      hint.textContent="Vuốt lên / xuống để chọn tên";
    },250);
  }
  question.style.pointerEvents="auto";
  question.addEventListener("pointerdown",openQuestion1,{passive:false});
  question.addEventListener("click",openQuestion1);

  confirm.addEventListener("click",()=>{
    const selected=names[current];

    /* Người dùng nói đáp án là v => Tiến Lợi.
       Nếu chọn tên khác vẫn cho đi tiếp, nhưng câu chào phản ánh tên đã chọn. */
    const rank=selected===correctName?"S rank":"người chơi";

    showMessage(
      `Xin chào<br>${rank} “${selected}”`,
      3000,
      showQuestion2
    );
  });

  /* =========================
     CÂU 2
  ========================= */
  function showQuestion2(){
    counter.textContent="CÂU 2";
    question.textContent="Hôm nay bạn đã đăng bài chưa?";
    question.style.opacity="1";
    question.style.pointerEvents="none";
    question.style.transform="scale(1)";
    question.style.animation="breathe 2.8s ease-in-out infinite";

    /* Câu 2 dùng 2 nút, không dùng wheel */
    const box=document.createElement("div");
    box.id="q2answers";
    box.innerHTML=`
      <button id="doneBtn" type="button">Tôi đã hoàn thành</button>
      <button id="laterBtn" type="button">Chưa, tôi sẽ quay lại sau</button>
    `;
    root.appendChild(box);

    Object.assign(box.style,{
      position:"absolute",left:"50%",top:"64%",transform:"translate(-50%,0)",
      zIndex:"22",display:"flex",flexDirection:"column",gap:"12px",
      width:"min(88vw,390px)",opacity:"0",transition:"opacity .35s,transform .35s"
    });

    [...box.querySelectorAll("button")].forEach(b=>{
      Object.assign(b.style,{
        minHeight:"50px",padding:"10px 18px",borderRadius:"999px",
        border:"1px solid rgba(255,255,255,.25)",
        color:"#fff",fontSize:"15px",fontWeight:"700",
        background:"rgba(255,255,255,.07)",backdropFilter:"blur(10px)"
      });
    });
    box.querySelector("#doneBtn").style.background="linear-gradient(135deg,#ff3c91,#ff70b9)";
    box.querySelector("#doneBtn").style.boxShadow="0 0 22px rgba(255,50,145,.45)";

    requestAnimationFrame(()=>{box.style.opacity="1";box.style.transform="translate(-50%,0)"});

    box.querySelector("#doneBtn").addEventListener("click",async()=>{
      const completedIndex=current;
      const completedName=names[current];
      box.remove();

      // Lưu vào Google Sheets trước, đồng thời cập nhật giao diện ngay.
      await saveCompletion(completedName);

      showMessage(
        `Chúc mừng!<br><span class="small">Người chơi S rank “${completedName}” đã hoàn thành nhiệm vụ 🎉</span>`,
        1200
      );
      hint.textContent="";
      setTimeout(()=>{
        message.classList.remove("show");
        showChecklist(completedIndex);
      },1300);
    });

    box.querySelector("#laterBtn").addEventListener("click",async()=>{
      const completedIndex=current;
      const completedName=names[current];
      box.remove();

      // Nếu chọn "Chưa", bỏ tick ngay trên web và xoá trạng thái của ngày hôm nay trên Sheet.
      await saveCompletion(completedName,false);

      showMessage(
        `Không sao!<br><span class="small">Cố lên “${completedName}” 💪<br>Hoàn thành nhiệm vụ rồi quay lại nhé!</span>`,
        1200
      );
      hint.textContent="";
      setTimeout(()=>{
        message.classList.remove("show");
        showChecklist(completedIndex);
      },1300);
    });
  }

  renderWheel();
  loadChecklistFromSheet();
  scheduleDailyReset();
})();
</script>
</body>
</html>
