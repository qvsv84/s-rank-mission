<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050208">
<title>S Rank — Daily Mission</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010107}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none}
button{font:inherit}
#space{position:relative;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 50%,rgba(255,55,160,.10),transparent 27%),
radial-gradient(circle at 50% 50%,#080812 0,#020207 58%,#000 100%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
#questionWrap{position:absolute;left:50%;top:36%;z-index:10;width:min(92vw,650px);transform:translate(-50%,-50%);text-align:center}
#counter{display:none !important;font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.45);margin-bottom:16px}
#question{color:#fff;font-size:clamp(25px,7vw,54px);font-weight:750;line-height:1.18;
text-shadow:0 0 6px #fff,0 0 18px #ff4fa3,0 0 42px #ff4fa3;cursor:pointer;user-select:none;
transition:opacity .25s,transform .25s;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

#wheelArea{position:absolute;left:50%;top:65%;z-index:20;width:min(88vw,390px);height:250px;
transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .25s}
#wheelArea.show{opacity:1;pointer-events:auto}
#wheelViewport{position:absolute;inset:0;overflow:hidden;border-radius:28px;
background:linear-gradient(to bottom,rgba(0,0,0,.93),rgba(15,5,14,.32) 50%,rgba(0,0,0,.93));
border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 0 35px rgba(255,60,160,.08)}
#selectionLine{position:absolute;left:8%;right:8%;top:50%;height:58px;transform:translateY(-50%);
border-top:1px solid rgba(255,105,185,.6);border-bottom:1px solid rgba(255,105,185,.6);
background:rgba(255,70,165,.055);border-radius:14px;z-index:3;pointer-events:none}
#items{position:absolute;left:0;right:0;top:0;height:100%}
.item{position:absolute;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;
color:rgba(255,255,255,.22);font-size:21px;font-weight:650;transform-origin:center;user-select:none}
.item.selected{color:#fff;text-shadow:0 0 6px #fff,0 0 17px #ff4fa3,0 0 35px #ff4fa3}
#wheelHint{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);
color:rgba(255,255,255,.38);font-size:12px;white-space:nowrap}
#confirm{position:absolute;left:50%;bottom:-91px;transform:translateX(-50%);min-width:130px;min-height:46px;
padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.25);
background:linear-gradient(135deg,#ff3c91,#ff70b9);color:#fff;font-size:15px;font-weight:700;
box-shadow:0 0 20px rgba(255,50,145,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#confirm.show{opacity:1;pointer-events:auto}

#message{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
padding:25px;text-align:center;pointer-events:none;color:#fff;font-weight:800;
font-size:clamp(28px,7.5vw,62px);line-height:1.12;text-shadow:0 0 8px #fff,0 0 25px #ff4fa3,0 0 65px #ff4fa3;
opacity:0;transform:scale(.6)}
#message.show{animation:messageIn .75s cubic-bezier(.16,.9,.25,1) forwards}
@keyframes messageIn{0%{opacity:0;transform:scale(.35);filter:blur(12px)}
60%{opacity:1;transform:scale(1.08);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
#message .small{display:block;font-size:.42em;font-weight:500;margin-top:16px;color:rgba(255,255,255,.68)}
.heart{position:absolute;left:50%;top:50%;z-index:25;pointer-events:none;color:#ff397f;font-size:22px;
text-shadow:0 0 8px #ff397f,0 0 22px #ff397f;animation:fly var(--time) ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(var(--s))}}
.flash{position:absolute;left:50%;top:50%;z-index:24;width:8px;height:8px;border-radius:50%;background:#fff;
box-shadow:0 0 20px #fff,0 0 60px #ff4fa3,0 0 120px #ff4fa3;transform:translate(-50%,-50%);animation:flash .65s ease-out forwards}
@keyframes flash{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(42)}}

#hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);color:rgba(255,255,255,.38);font-size:12px;z-index:10;white-space:nowrap}
#status{position:absolute;right:12px;top:10px;z-index:100;color:rgba(255,255,255,.42);font-size:10px;opacity:0;transition:opacity .2s}
#status.show{opacity:1}

#checklistPanel{position:absolute;left:50%;top:50%;z-index:9999;width:min(90vw,460px);max-height:82vh;
transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .3s}
#checklistPanel.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#checklistTitle{text-align:center;color:#fff;font-size:clamp(24px,6vw,36px);font-weight:800;margin-bottom:6px;
text-shadow:0 0 10px #fff,0 0 28px #ff4fa3}
#checklistSub{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-bottom:14px}
#checklistScroll{max-height:65vh;overflow:auto;border-radius:20px;scrollbar-width:none}
#checklistScroll::-webkit-scrollbar{display:none}
#checklist{width:100%;border-collapse:separate;border-spacing:0;border:1px solid rgba(255,255,255,.14);
border-radius:20px;overflow:hidden;background:rgba(8,4,12,.78);backdrop-filter:blur(14px)}
#checklist th,#checklist td{padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.07)}
#checklist th{color:rgba(255,255,255,.48);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
#checklist th:last-child,#checklist td:last-child{text-align:center;width:78px}
#checklist tr:last-child td{border-bottom:0}
.checkTime{color:rgba(255,255,255,.62);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}.playerName{color:rgba(255,255,255,.8);font-size:14px;font-weight:600}
.checkBox{width:25px;height:25px;border-radius:8px;margin:auto;border:1px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.checkBox.checked{border-color:#ff70b9;background:linear-gradient(135deg,#ff3c91,#ff70b9);
box-shadow:0 0 15px rgba(255,55,155,.65);animation:checkPop .45s cubic-bezier(.16,.9,.25,1)}
.checkBox.checked::after{content:"✓";color:#fff;font-size:17px;font-weight:900}
@keyframes checkPop{0%{transform:scale(.3);opacity:.2}65%{transform:scale(1.2)}100%{transform:scale(1)}}
#checklistActions{display:flex;justify-content:center;gap:8px;margin:12px auto 0;flex-wrap:wrap}
#checklistActions button{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 14px;
background:rgba(255,255,255,.08);color:rgba(255,255,255,.82);font-size:12px;font-weight:700;
box-shadow:0 0 14px rgba(255,60,160,.08)}
#captureBtn{background:linear-gradient(135deg,rgba(255,60,145,.9),rgba(255,112,185,.72)) !important;color:#fff !important}
#checklistActions button:active{transform:scale(.96)}

#myPointCard{position:absolute;left:50%;top:43%;z-index:11;transform:translate(-50%,-50%);min-width:170px;padding:8px 14px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(8,4,14,.48);backdrop-filter:blur(12px);box-shadow:0 0 22px rgba(255,60,160,.08);color:rgba(255,255,255,.78);font-size:12px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#myPointCard.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#myPointCard .pointValue{color:#ff9dcc;text-shadow:0 0 10px rgba(255,60,160,.65);font-size:15px;margin-left:4px}
#myPointCard.bump .pointValue{animation:pointBump .65s cubic-bezier(.16,.9,.25,1)}
@keyframes pointBump{0%{transform:scale(1)}35%{transform:scale(1.45);text-shadow:0 0 20px #ff4fa3}100%{transform:scale(1)}}
#topBtn{color:#ffb5d8}
#topPanel{position:absolute;left:50%;top:50%;z-index:10001;width:min(92vw,500px);max-height:82vh;transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .3s;padding:20px;border:1px solid rgba(255,255,255,.14);border-radius:26px;background:linear-gradient(145deg,rgba(20,8,24,.97),rgba(6,4,12,.98));box-shadow:0 18px 60px rgba(0,0,0,.62),0 0 40px rgba(255,60,160,.16);backdrop-filter:blur(18px)}
#topPanel.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#topTitle{text-align:center;color:#fff;font-size:26px;font-weight:850;text-shadow:0 0 10px #fff,0 0 28px #ff4fa3}
#topSub{text-align:center;color:rgba(255,255,255,.48);font-size:12px;margin:5px 0 15px}
#topScroll{max-height:60vh;overflow:auto;border-radius:18px;scrollbar-width:none}
#topScroll::-webkit-scrollbar{display:none}
#topTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid rgba(255,255,255,.12);border-radius:18px;overflow:hidden;background:rgba(8,4,12,.72)}
#topTable th,#topTable td{padding:11px 9px;border-bottom:1px solid rgba(255,255,255,.07)}
#topTable th{color:rgba(255,255,255,.42);font-size:10px;letter-spacing:1px;text-transform:uppercase}
#topTable th:first-child,#topTable td:first-child{text-align:center;width:42px}
#topTable th:nth-child(3),#topTable td:nth-child(3){text-align:right;white-space:nowrap}
#topTable th:last-child,#topTable td:last-child{text-align:center;width:62px}
.topName{color:rgba(255,255,255,.86);font-size:13px;font-weight:700}.topPoints{color:#ff9dcc;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}.topRank{display:inline-flex;min-width:36px;justify-content:center;padding:4px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:10px;font-weight:900}
.topRow1{background:linear-gradient(90deg,rgba(255,215,120,.10),transparent)}.topRow2{background:linear-gradient(90deg,rgba(210,220,235,.08),transparent)}.topRow3{background:linear-gradient(90deg,rgba(190,120,80,.08),transparent)}
#topTable tr:last-child td{border-bottom:0}
#topCloseBtn{display:block;margin:13px auto 0;min-width:110px;min-height:40px;padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,#ff3c91,#ff70b9);color:#fff;font-weight:800}
#bottomNav{
 position:absolute;right:16px;top:16px;z-index:10000;
 display:flex;gap:7px;width:auto;justify-content:center;
 padding:5px;border:1px solid rgba(255,255,255,.10);border-radius:999px;
 background:rgba(8,4,14,.52);backdrop-filter:blur(14px);
 box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 22px rgba(255,60,160,.08);
}
#bottomNav button{
 flex:0 0 auto;min-height:36px;padding:7px 12px;border-radius:999px;
 border:1px solid rgba(255,255,255,.10);
 background:transparent;color:rgba(255,255,255,.72);font-size:11px;font-weight:700;
 white-space:nowrap;transition:transform .18s,background .2s,box-shadow .2s,color .2s;
}
#bottomNav button:active{transform:scale(.96)}
#homeBtn{
 background:linear-gradient(135deg,rgba(255,60,145,.88),rgba(255,112,185,.72)) !important;
 color:#fff !important;box-shadow:0 0 16px rgba(255,60,160,.18);
}
#checklistBtn{color:rgba(255,255,255,.86)}

/* Khi đang chọn tên, ẩn thanh Home/Checklist để không che nút Xác nhận */
#space:has(#wheelArea.show) #bottomNav{
 display:none !important;
}

/* ===== ADMIN ===== */
#adminBtn{color:rgba(255,255,255,.86)}
#adminOverlay{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.68);backdrop-filter:blur(10px)}
#adminOverlay.show{display:flex}
#adminPasswordBox{width:min(88vw,340px);padding:22px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:linear-gradient(145deg,rgba(20,8,24,.98),rgba(6,4,12,.99));box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 35px rgba(255,60,160,.16);color:#fff;text-align:center}
#adminPasswordTitle{font-size:20px;font-weight:800;text-shadow:0 0 12px #ff4fa3;margin-bottom:6px}
#adminPasswordSub{font-size:12px;color:rgba(255,255,255,.48);margin-bottom:14px}
#adminPasswordInput{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:20px;text-align:center;letter-spacing:5px;outline:none}
#adminPasswordMsg{min-height:18px;margin:9px 0;color:#ff9dcc;font-size:12px}
#adminPasswordActions{display:flex;gap:9px}
#adminPasswordActions button{flex:1;min-height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-weight:700}
#adminPasswordOk{background:linear-gradient(135deg,#ff3c91,#ff70b9)!important}
#adminPanel{width:min(92vw,390px);padding:22px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(145deg,rgba(20,8,24,.96),rgba(6,4,12,.97));box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 35px rgba(255,60,160,.14);color:#fff}
#adminTitle{text-align:center;font-size:22px;font-weight:800;text-shadow:0 0 14px #ff4fa3;margin-bottom:5px}
#adminSub{text-align:center;color:rgba(255,255,255,.48);font-size:12px;margin-bottom:18px}
.adminField{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.adminField label{font-size:13px;color:rgba(255,255,255,.72)}
#resetTimeInput{width:120px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:18px;text-align:center;outline:none}
#adminStatus{text-align:center;min-height:18px;margin:10px 0;color:#ff9dcc;font-size:12px}
#adminActions{display:flex;gap:9px}
#adminActions button{flex:1;min-height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-weight:700}
#adminSaveBtn{background:linear-gradient(135deg,#ff3c91,#ff70b9)!important;box-shadow:0 0 18px rgba(255,50,145,.3)}
#adminResetNowBtn{margin-top:10px;width:100%;min-height:40px;border-radius:999px;border:1px solid rgba(255,120,180,.18);background:rgba(255,60,145,.08);color:#ffb0d3;font-weight:700}
@media (max-width:420px){
 #bottomNav{right:10px;top:10px;gap:5px;padding:4px}
 #bottomNav button{min-height:34px;padding:6px 10px;font-size:10px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<main id="space">
<canvas id="stars"></canvas>
<div id="status"></div>

<div id="questionWrap">
  <div id="counter">CÂU 1</div>
  <div id="question">Tên bạn là gì?</div>
</div>

<div id="myPointCard" aria-live="polite">⭐ Điểm hiện tại <span class="pointValue">—</span></div>

<div id="wheelArea">
  <div id="wheelViewport"><div id="selectionLine"></div><div id="items"></div></div>
  <div id="wheelHint">Vuốt lên / xuống để chọn</div>
  <button id="confirm" type="button">Xác nhận ❤️</button>
</div>

<div id="message"></div>

<section id="checklistPanel">
  <div id="checklistTitle">Checklist nhiệm vụ</div>
  <div id="checklistSub">Danh sách người chơi</div>
  <div id="checklistScroll"><table id="checklist">
    <thead><tr><th>Người chơi</th><th>Giờ</th><th>Hoàn thành</th></tr></thead><tbody></tbody>
  </table></div>
  <div id="checklistActions"><button id="captureBtn" type="button">📸 Chụp checklist</button><button id="syncBtn" type="button">↻ Đồng bộ lại</button></div>
</section>

<section id="topPanel" aria-hidden="true">
  <div id="topTitle">🏆 BXH TOP</div>
  <div id="topSub">Xếp hạng theo tổng điểm</div>
  <div id="topScroll"><table id="topTable">
    <thead><tr><th>#</th><th>Tên</th><th>⭐ Điểm</th><th>Rank</th></tr></thead><tbody></tbody>
  </table></div>
  <button id="topCloseBtn" type="button">Đóng</button>
</section>

<nav id="bottomNav">
  <button id="homeBtn" type="button">⌂ Home</button>
  <button id="adminBtn" type="button">⚙ Admin</button>
  <button id="topBtn" type="button">🏆 BXH TOP</button>
  <button id="checklistBtn" type="button">☑ Checklist</button>
</nav>
<div id="adminPasswordOverlay" class="adminOverlay" aria-hidden="true" style="position:fixed;inset:0;z-index:21000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);">
  <section id="adminPasswordBox">
    <div id="adminPasswordTitle">🔐 Admin</div>
    <div id="adminPasswordSub">Nhập mật khẩu để mở cài đặt</div>
    <input id="adminPasswordInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <div id="adminPasswordMsg"></div>
    <div id="adminPasswordActions"><button id="adminPasswordCancel" type="button">Huỷ</button><button id="adminPasswordOk" type="button">Xác nhận</button></div>
  </section>
</div>
<div id="adminOverlay" aria-hidden="true">
  <section id="adminPanel" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div id="adminTitle">⚙ Cài đặt Admin</div>
    <div id="adminSub">Thiết lập giờ làm mới checklist hằng ngày</div>
    <div class="adminField">
      <label for="resetTimeInput">Giờ reset mỗi ngày</label>
      <input id="resetTimeInput" type="text" value="00:00" inputmode="numeric" maxlength="5" pattern="(?:[01]\d|2[0-3]):[0-5]\d" placeholder="00:00" autocomplete="off" aria-label="Giờ reset 24 giờ">
    </div>
    <div id="adminStatus"></div>
    <div id="adminActions">
      <button id="adminCloseBtn" type="button">Đóng</button>
      <button id="adminSaveBtn" type="button">Lưu cài đặt</button>
    </div>
    <button id="adminResetNowBtn" type="button">↻ Reset checklist ngay</button>
  </section>
</div>
<div id="hint">Đang tải dữ liệu…</div>
</main>

<script>
(() => {
  "use strict";

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxZzmtKDvCL7OTfyyg7bqP0i_b5Ygt0YbRWnEclg6fSJ2pcc1LaHAL2e33aFxY2e0dSQ/exec";
  const CACHE_KEY = "srank_check_v4";

  const root = document.getElementById("space");

  const adminStatus = document.getElementById("adminStatus");
  const adminCloseBtn = document.getElementById("adminCloseBtn");
  const adminSaveBtn = document.getElementById("adminSaveBtn");

  // Giờ reset luôn dùng định dạng 24 giờ HH:mm
  resetTimeInput.addEventListener("input", () => {
    let v = resetTimeInput.value.replace(/\D/g, "").slice(0, 4);
    if(v.length > 2) v = v.slice(0,2) + ":" + v.slice(2);

  });
  const captureBtn = document.getElementById("captureBtn");

  let names = [];
  let checked = [];
  let times = [];
  let points = [];
  let ranks = [];
  let current = 0;
  let q1Opened = false;
  let dragging = false, startY = 0, dragOffset = 0;
  const ITEM_H = 58;

  // ---------- Fast JSONP transport ----------
  let requestSeq = 0;
  function api(action, data = {}, timeout = 7000){
    return new Promise((resolve,reject) => {
      const cb = "__srank_" + Date.now() + "_" + (++requestSeq);
      const script = document.createElement("script");
      const u = new URL(SCRIPT_URL);
      u.searchParams.set("action", action);
      u.searchParams.set("callback", cb);
      for(const [k,v] of Object.entries(data)) u.searchParams.set(k, v);

      let done = false;
      const finish = (fn, value) => {

        delete window[cb];
        script.remove();
        fn(value);
      };
      window[cb] = result => finish(resolve, result);
      script.onerror = () => finish(reject, new Error("Không kết nối được Google Sheet"));
      const timer = setTimeout(() => finish(reject, new Error("Google Sheet phản hồi chậm")), timeout);
      script.src = u.toString();
      document.head.appendChild(script);
    });
  }

  function todayKey(){
    const d = new Date();
    const parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(d);
    const get = k => parts.find(x=>x.type===k)?.value || "";
    return `${get("year")}-${get("month")}-${get("day")}`;
  }

  function cacheSave(){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({names,checked,times,points,ranks,day:todayKey(),ts:Date.now()}));
      localStorage.setItem(DAY_KEY, todayKey());
    }catch(_){}
  }
  function cacheLoad(){
    try{
      const x = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if(x && x.day === todayKey() && Array.isArray(x.names) && Array.isArray(x.checked)){
        names = x.names;
        checked = x.checked;
        times = Array.isArray(x.times) ? x.times : [];
        points = Array.isArray(x.points) ? x.points : names.map(()=>100);
        ranks = points.map(rankClient);
        return true;
      }
      // Cache của ngày cũ không được dùng lại.
      localStorage.removeItem(CACHE_KEY);
      localStorage.setItem(DAY_KEY, todayKey());
    }catch(_){}
    return false;
  }

  function scheduleNextReset(){
    if(resetTimer) clearTimeout(resetTimer);
    const now = new Date();
    const [hh,mm] = String(resetTime || "00:00").split(":").map(Number);
    const next = new Date(now);
    next.setHours(Number.isFinite(hh)?hh:0, Number.isFinite(mm)?mm:0, 3, 0);
    if(next.getTime() <= now.getTime()) next.setDate(next.getDate()+1);
    resetTimer = setTimeout(async()=>{
      checked = names.map(()=>false);
      times = names.map(()=>"");
      cacheSave();
      renderChecklist();
      setStatus("Checklist đã làm mới ✓");

  function renderChecklist(){
    checklistBody.innerHTML = "";

    // Chỉ sắp xếp thứ tự HIỂN THỊ trên HTML.
    // Không thay đổi names/checked/times gốc nên không ảnh hưởng Google Sheet.
    const rows = names.map((name,i) => ({
      name,
      index: i,
      checked: !!checked[i],
      time: times[i] || ""
    }));

    rows.sort((a,b) => {
      // Người đã check luôn ở trên người chưa check.
      if(a.checked !== b.checked) return a.checked ? -1 : 1;

      // Trong nhóm đã check: giờ sớm hơn ở trên.
      if(a.checked && b.checked){
        const ta = a.time || "99:99";
        const tb = b.time || "99:99";
        const cmp = ta.localeCompare(tb);
        if(cmp !== 0) return cmp;
      }

      // Nếu cùng giờ / chưa check: giữ nguyên thứ tự trong Sheet.
      return a.index - b.index;
    });

    rows.forEach(row => {
      const tr = document.createElement("tr");

  async function checkin(name, index){
    const localTime = new Intl.DateTimeFormat("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
    times[index] = localTime;

    try{
      const r = await api("checkin",{name},6000);
      if(!r.ok) throw new Error(r.error || "checkin lỗi");
      if(r.data && r.data.time) { times[index] = r.data.time; }
      if(r.data && Number.isFinite(Number(r.data.points))) {
        const before = Number(points[index]) || 0;
        points[index] = Number(r.data.points);
        ranks[index] = r.data.rank || rankClient(points[index]);
        cacheSave();
        renderChecklist();

        // Apps Script là nơi quyết định điểm. Một ngày chỉ được +10 một lần.
        if(Number(r.data.pointsAdded) > 0) {
          bumpPointCard();

        cacheSave();
        renderChecklist();
      }
      // Không gọi getData lần 2 -> giảm hẳn 1 request.
    }catch(e){
      // Nếu ghi thất bại, lấy lại trạng thái thật từ Sheet.
      setStatus("Đang xác nhận…");
      await loadData(false);
      setStatus("Đã kiểm tra lại");
    }
  }

  // ---------- Visuals ----------
  let W=innerWidth,H=innerHeight,DPR=1;
  const stars=[];
  const STAR_COUNT=110; // giảm tải GPU/CPU
  function resize(){
    W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener("resize",resize,{passive:true});
  resize();
  for(let i=0;i<STAR_COUNT;i++) stars.push({
    angle:Math.random()*Math.PI*2,radius:.38+Math.random()*.9,
    tilt:(Math.random()-.5)*1.5,speed:.00010+Math.random()*.00016,
    size:.45+Math.random()*1.7,phase:Math.random()*Math.PI*2,alpha:.2+Math.random()*.75
  });
  function drawStars(time){
    ctx.clearRect(0,0,W,H);
    const cx=W*.5,cy=H*.5,base=Math.min(W,H);
    for(const s of stars){
      const a=s.angle+time*s.speed, ox=base*(.72+s.radius*.20), oy=base*(.25+s.radius*.16);
      const x=Math.cos(a)*ox,y=Math.sin(a)*oy;
      const yy=y*Math.cos(s.tilt)-x*.12*Math.sin(s.tilt);
      const xx=x*Math.cos(s.tilt)+y*.12*Math.sin(s.tilt);
      const z=(Math.sin(a)+1)/2, p=.48+z*.85;
      const px=cx+xx*p,py=cy+yy*p,alpha=s.alpha*(.72+.28*Math.sin(time*.002+s.phase))*(.25+z*.75);
      ctx.beginPath();ctx.arc(px,py,s.size*(.55+z*1.45),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,245,252,${alpha})`;ctx.shadowColor="rgba(255,110,190,.9)";
      ctx.shadowBlur=3+z*7;ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  // Hiệu ứng lời chào: từng dòng xuất hiện theo kiểu gõ chữ,
  // riêng điểm chạy từ 000 -> điểm thực tế trong khoảng 1.2 giây.
  function showActivationMessage(name, rank, score, next){
    wheelArea.classList.remove("show");
    question.style.opacity="0";
    hint.textContent="";

    const safeScore = Math.max(0, Number(score) || 0);

    message.innerHTML = `
      <div class="activation-message">
        <div class="activation-line" data-text="Kích hoạt hệ thống thành công"></div>
        <div class="activation-line" data-text="Ký chủ: ${name}"></div>
        <div class="activation-line" data-text="Rank: ${rank}"></div>
        <div class="activation-line score-line">
          <span>Điểm đánh giá: </span><span id="animatedScore">000</span>
        </div>
      </div>
    `;

    message.classList.remove("show");
    void message.offsetWidth;
    message.classList.add("show");
    burst();

    const lines = [...message.querySelectorAll(".activation-line:not(.score-line)")];
    const scoreLine = message.querySelector(".score-line");
    const scoreEl = message.querySelector("#animatedScore");

    lines.forEach(line => {
      line.style.opacity = "0";
      line.style.visibility = "hidden";
    });
    scoreLine.style.opacity = "0";
    scoreLine.style.visibility = "hidden";

    let lineIndex = 0;

    function typeLine(el, text, done){
      el.style.visibility = "visible";
      el.style.opacity = "1";
      el.textContent = "";
      let i = 0;

      function tick(){
        if(i < text.length){
          el.textContent += text[i++];
          setTimeout(tick, 30);
        }else{
          setTimeout(done, 110);
        }
      }
      tick();
    }

    function animateScore(){
      scoreLine.style.visibility = "visible";
      scoreLine.style.opacity = "1";

      const start = performance.now();
      const duration = 1200;

      function frame(now){
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = Math.round(safeScore * eased);
        scoreEl.textContent = String(value).padStart(3, "0");

        if(progress < 1){
          requestAnimationFrame(frame);
        }else{
          scoreEl.textContent = String(safeScore).padStart(3, "0");
        }
      }

      requestAnimationFrame(frame);
    }

    function nextLine(){
      if(lineIndex < lines.length){
        const el = lines[lineIndex++];
        typeLine(el, el.dataset.text, nextLine);
      }else{
        animateScore();
      }
    }

    nextLine();

    if(next){
      setTimeout(()=>{
        message.classList.remove("show");
        setTimeout(next, 220);
      }, 3600);
    }
  }

    const box=document.createElement("div");
    box.id="q2answers";
    box.innerHTML=`<button id="doneBtn">Tôi đã hoàn thành</button><button id="laterBtn">Chưa, tôi sẽ quay lại sau</button>`;
    root.appendChild(box);
    Object.assign(box.style,{position:"absolute",left:"50%",top:"64%",transform:"translate(-50%,0)",zIndex:"22",
      display:"flex",flexDirection:"column",gap:"12px",width:"min(88vw,390px)",opacity:"0",transition:"opacity .25s"});
    [...box.children].forEach(b=>Object.assign(b.style,{minHeight:"50px",padding:"10px 18px",borderRadius:"999px",
      border:"1px solid rgba(255,255,255,.25)",color:"#fff",fontSize:"15px",fontWeight:"700",
      background:"rgba(255,255,255,.07)",backdropFilter:"blur(10px)"}));
    box.querySelector("#doneBtn").style.background="linear-gradient(135deg,#ff3c91,#ff70b9)";
    requestAnimationFrame(()=>box.style.opacity="1");

    box.querySelector("#doneBtn").addEventListener("click",async()=>{
      const completedIndex=current, selected=names[current];
      box.remove();
      showMessage(`Chúc mừng!<br><span class="small">“${selected}” đã hoàn thành nhiệm vụ 🎉</span>`,900);
      // Ghi Sheet song song với việc hiện animation, không chặn giao diện.
      checkin(selected,completedIndex);
      setTimeout(()=>{
        // Sau khi hoàn thành: mở Checklist chắc chắn, kể cả trước đó bảng đang ẩn.
        message.classList.remove("show");
        renderChecklist();
        checklistPanel.classList.add("show");
        checklistPanel.style.visibility = "visible";
        checklistPanel.style.opacity = "1";
        checklistPanel.style.pointerEvents = "auto";
        const row=checklistBody.querySelector(`tr[data-index="${completedIndex}"]`);
        if(row) {
          row.classList.add("completed");
          row.querySelector(".checkBox")?.classList.add("checked");
          setTimeout(()=>row.scrollIntoView({block:"center",behavior:"smooth"}),80);
        }
      },1000);
    });

    box.querySelector("#laterBtn").addEventListener("click",()=>{
      box.remove();
      showMessage(`Không sao!<br><span class="small">Cố lên “${names[current]}” 💪</span>`,0);
    });
  }


  // ---------- Chụp checklist ----------
  async function captureChecklist(){
    if(!checklistPanel.classList.contains("show")) return;
    if(typeof html2canvas !== "function"){
      setStatus("Không tải được công cụ chụp");
      return;
    }

    captureBtn.disabled = true;
    const oldText = captureBtn.textContent;
    captureBtn.textContent = "⏳ Đang tạo ảnh…";

    // Tạo một bản sao riêng để ảnh luôn chứa TOÀN BỘ danh sách,
    // không phụ thuộc phần đang cuộn trên màn hình.
    const clone = checklistPanel.cloneNode(true);
    clone.id = "checklistCaptureTemp";
    clone.querySelector("#checklistActions")?.remove();
    clone.style.cssText = `
      position:absolute !important;
      left:-100000px !important;
      top:0 !important;
      width:${Math.min(window.innerWidth * 0.90, 460)}px !important;
      max-height:none !important;
      height:auto !important;
      transform:none !important;
      opacity:1 !important;
      visibility:visible !important;
      pointer-events:none !important;
      background:linear-gradient(145deg,#09040d,#140713 55%,#07030b) !important;
      padding:22px !important;
      border-radius:26px !important;
      box-shadow:0 0 40px rgba(255,60,160,.16) !important;
    `;
    const scroll = clone.querySelector("#checklistScroll");
    if(scroll){
      scroll.style.maxHeight = "none";
      scroll.style.height = "auto";
      scroll.style.overflow = "visible";
      scroll.style.borderRadius = "20px";
    }
    document.body.appendChild(clone);

    try{
      // Chờ layout/font ổn định trước khi render canvas.
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      const canvas = await html2canvas(clone,{
        backgroundColor:null,
        scale:Math.min(3, Math.max(2, window.devicePixelRatio || 2)),
        useCORS:true,
        logging:false,
        width:clone.offsetWidth,
        height:clone.scrollHeight,
        windowWidth:clone.offsetWidth,
        windowHeight:clone.scrollHeight
      });

      const blob = await new Promise(resolve=>canvas.toBlob(resolve,"image/png",1));
      if(!blob) throw new Error("Không tạo được ảnh");

      const file = new File([blob],"checklist-s-rank.png",{type:"image/png"});

      // iPhone/iPad Safari: mở Share Sheet với file ảnh.
      // Người dùng chọn "Lưu hình ảnh" để lưu trực tiếp vào Ảnh.
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        await navigator.share({
          files:[file],
          title:"Checklist S Rank",
          text:"Checklist nhiệm vụ"
        });
      }else{
        // Fallback cho trình duyệt không hỗ trợ chia sẻ file.
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="checklist-s-rank.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),2000);
        setStatus("Ảnh đã tạo ✓");
      }
    }catch(err){
      // Bấm đóng Share Sheet trên iPhone không phải lỗi cần báo.
      if(String(err?.name||"") !== "AbortError"){
        console.error(err);
        setStatus("Chụp ảnh thất bại");
      }
    }finally{
      clone.remove();
      captureBtn.disabled = false;
      captureBtn.textContent = oldText;
    }
  }

  captureBtn.addEventListener("click",captureChecklist);


  // ---------- Navigation ----------
  function resetHome(){
    document.getElementById("q2answers")?.remove();
    closeTop();
    checklistPanel.classList.remove("show");
    checklistPanel.style.visibility = "hidden";
    checklistPanel.style.opacity = "0";
    checklistPanel.style.pointerEvents = "none";
    message.classList.remove("show");
    wheelArea.classList.remove("show");
    confirm.classList.remove("show");
    myPointCard.classList.remove("show");

    q1Opened = false;
    current = 0;
    dragOffset = 0;
    dragging = false;

    counter.textContent = "CÂU 1";
    question.textContent = "Tên bạn là gì?";
    question.style.opacity = "1";
    question.style.pointerEvents = "auto";
    question.style.transform = "scale(1)";
    question.style.animation = "breathe 2.8s ease-in-out infinite";

    hint.textContent = names.length ? "Chạm vào câu hỏi" : "Đang tải dữ liệu…";
    renderWheel();
  }

  homeBtn.addEventListener("click", resetHome);

  checklistBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();

    const willShow = !checklistPanel.classList.contains("show");

    if (willShow) {
      closeTop();
      // HIỆN bảng
      checklistPanel.classList.add("show");
      checklistPanel.style.visibility = "visible";
      checklistPanel.style.opacity = "1";
      checklistPanel.style.pointerEvents = "auto";
      renderChecklist();
      loadData(false);
    } else {
      // ẨN bảng — xoá cả class lẫn inline style để chắc chắn ẩn
      checklistPanel.classList.remove("show");
      checklistPanel.style.visibility = "hidden";
      checklistPanel.style.opacity = "0";
      checklistPanel.style.pointerEvents = "none";
    }
  });

  topBtn.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    closeAdmin();
    checklistPanel.classList.remove("show");
    checklistPanel.style.visibility = "hidden";
    checklistPanel.style.opacity = "0";
    checklistPanel.style.pointerEvents = "none";
    renderTop();
    topPanel.classList.add("show");
    topPanel.setAttribute("aria-hidden","false");
  });

  topCloseBtn.addEventListener("click", closeTop);
  topPanel.addEventListener("click", e => { if(e.target === topPanel) closeTop(); });

  syncBtn.addEventListener("click",()=>loadData(true));

  // Load Sheet ngay khi mở; cache hiển thị trước nếu có.
  loadData(true);
  loadAdminSettings();
  scheduleNextReset();
})();
</script>
</body>
