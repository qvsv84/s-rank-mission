<script>
(function(){
  'use strict';

  const btn         = document.getElementById('menuToggle');
  const overlay     = document.getElementById('menuOverlay');
  const closeBtn    = overlay.querySelector('.menu-close');
  const loginOv     = document.getElementById('loginOverlay');
  const realLogout  = document.getElementById('logoutBtn');
  const realName    = document.getElementById('logoutName');
  const realAvatar  = document.getElementById('avatarBtn');
  const avatarInput = document.getElementById('avatarFileInput');
  const STORAGE_KEY = 'menuBtnPos';

  /* ============================================================
     1) KÉO NÚT 3 GẠCH + LƯU VỊ TRÍ
     ============================================================ */
  function clamp(x, y){
    const w = btn.offsetWidth  || 52;
    const h = btn.offsetHeight || 52;
    const maxX = window.innerWidth  - w - 4;
    const maxY = window.innerHeight - h - 4;
    return { x: Math.max(4, Math.min(x, maxX)), y: Math.max(4, Math.min(y, maxY)) };
  }
  function applyPos(x, y){
    const c = clamp(x, y);
    btn.style.left   = c.x + 'px';
    btn.style.top    = c.y + 'px';
    btn.style.right  = 'auto';
    btn.style.bottom = 'auto';
    return c;
  }
  function savePos(){
    const r = btn.getBoundingClientRect();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ x: r.left, y: r.top })); } catch(e){}
  }

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}
  requestAnimationFrame(() => {
    if (saved && typeof saved.x === 'number' && typeof saved.y === 'number'){
      applyPos(saved.x, saved.y);
    } else {
      const h = btn.offsetHeight || 52;
      applyPos(12, window.innerHeight - h - 12);
    }
  });
  window.addEventListener('resize', () => {
    const r = btn.getBoundingClientRect();
    applyPos(r.left, r.top);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      const r = btn.getBoundingClientRect();
      applyPos(r.left, r.top);
    }, 120);
  });

  /* ============================================================
     2) TRÍCH XUẤT URL AVATAR — 7 LỚP FALLBACK
     ============================================================ */
  function isImageUrl(s){
    return typeof s === 'string' && (/^https?:/i.test(s) || /^data:image\//i.test(s) || /^blob:/i.test(s));
  }
  function toCssUrl(s){
    if (!s) return '';
    // đã là url("...") hoặc url(...)
    if (/^url\(/i.test(s)) return s;
    return `url("${s}")`;
  }

  function extractAvatarUrl(){
    /* --- Lớp 1: <img> con của #avatarBtn --- */
    if (realAvatar){
      const innerImg = realAvatar.querySelector('img');
      if (innerImg && isImageUrl(innerImg.src)) return toCssUrl(innerImg.src);

      /* --- Lớp 2: inline style --- */
      const inline = realAvatar.style && realAvatar.style.backgroundImage;
      if (inline && inline !== 'none' && isImageUrl(inline.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''))){
        return inline;
      }

      /* --- Lớp 3: computed style --- */
      try {
        const cs = getComputedStyle(realAvatar).backgroundImage;
        if (cs && cs !== 'none'){
          const raw = cs.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
          if (isImageUrl(raw)) return cs;
        }
      } catch(e){}

      /* --- Lớp 4: data-avatar --- */
      const da = realAvatar.getAttribute && realAvatar.getAttribute('data-avatar');
      if (isImageUrl(da)) return toCssUrl(da);
    }

    /* --- Lớp 5: quét DOM các element có class/id chứa "avatar" --- */
    try {
      const nodes = document.querySelectorAll(
        'img[class*="avatar" i], img[id*="avatar" i], ' +
        '[class*="avatar" i] img, [id*="avatar" i] img, ' +
        '[class*="avatar" i][style*="background-image"], ' +
        '[id*="avatar" i][style*="background-image"]'
      );
      for (const el of nodes){
        if (el.tagName === 'IMG'){
          if (el.src && isImageUrl(el.src) && el !== realAvatar) {
            // bỏ qua icon svg mặc định
            if (!/\.svg(\?|$)/i.test(el.src) && !/^data:image\/svg/i.test(el.src)){
              return toCssUrl(el.src);
            }
          }
        } else {
          const bg = el.style && el.style.backgroundImage;
          if (bg && bg !== 'none'){
            const raw = bg.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
            if (isImageUrl(raw)) return bg;
          }
        }
      }
    } catch(e){}

    /* --- Lớp 6: localStorage --- */
    const commonKeys = [
      'avatar','avatarUrl','avatar_url','userAvatar','user_avatar',
      'meow_avatar','profileAvatar','profile_avatar','user_avatar_url'
    ];
    for (const k of commonKeys){
      try {
        const v = localStorage.getItem(k);
        if (!v) continue;
        if (isImageUrl(v)) return toCssUrl(v);
        if (v.trim().startsWith('{')){
          const j = JSON.parse(v);
          const u = j.url || j.avatar || j.avatarUrl || j.avatar_url || j.data;
          if (isImageUrl(u)) return toCssUrl(u);
        }
      } catch(e){}
    }
    // quét toàn bộ key có chữ 'avatar'
    try {
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (!k || !/avatar/i.test(k)) continue;
        const v = localStorage.getItem(k);
        if (!v) continue;
        if (isImageUrl(v)) return toCssUrl(v);
        if (v.trim().startsWith('{')){
          try {
            const j = JSON.parse(v);
            const u = j.url || j.avatar || j.avatarUrl || j.avatar_url || j.data;
            if (isImageUrl(u)) return toCssUrl(u);
          } catch(e){}
        }
      }
    } catch(e){}

    /* --- Lớp 7: sessionStorage --- */
    try {
      for (let i = 0; i < sessionStorage.length; i++){
        const k = sessionStorage.key(i);
        if (!k || !/avatar/i.test(k)) continue;
        const v = sessionStorage.getItem(k);
        if (!v) continue;
        if (isImageUrl(v)) return toCssUrl(v);
        if (v.trim().startsWith('{')){
          try {
            const j = JSON.parse(v);
            const u = j.url || j.avatar || j.avatarUrl || j.avatar_url || j.data;
            if (isImageUrl(u)) return toCssUrl(u);
          } catch(e){}
        }
      }
    } catch(e){}

    return '';
  }

  /* ============================================================
     3) SYNC USER CARD
     ============================================================ */
  function isLoggedIn(){
    if (!realLogout) return false;
    return !realLogout.hidden;
  }

  function syncUserCard(){
    const card     = document.getElementById('menuUserCard');
    const nameEl   = document.getElementById('menuUserName');
    const avatarEl = document.getElementById('menuUserAvatar');
    if (!card || !nameEl || !avatarEl) return;

    if (!isLoggedIn()){
      card.hidden = true;
      return;
    }
    card.hidden = false;

    const name = ((realName && realName.textContent) || '').trim() || 'Thành viên';
    nameEl.textContent = name;

    const url = extractAvatarUrl();
    if (url){
      avatarEl.style.backgroundImage = url;
      avatarEl.textContent = '';           // xoá chữ cái nếu có
    } else {
      // Không có avatar → icon mèo mặc định (KHÔNG dùng chữ cái)
      avatarEl.style.backgroundImage = '';
      avatarEl.textContent = '🐱';
    }
  }

  /* ============================================================
     4) MỞ / ĐÓNG MENU
     ============================================================ */
  let autoSyncTimer = null;
  function startAutoSync(){
    stopAutoSync();
    syncUserCard();
    let n = 0;
    autoSyncTimer = setInterval(() => {
      syncUserCard();
      if (++n >= 6) stopAutoSync();       // 6 lần x 300ms = ~1.8s
    }, 300);
  }
  function stopAutoSync(){
    if (autoSyncTimer){ clearInterval(autoSyncTimer); autoSyncTimer = null; }
  }

  function applyStagger(){
    const items = overlay.querySelectorAll('.menu-item');
    items.forEach((el, i) => {
      el.style.setProperty('--delay', (0.08 + i * 0.035).toFixed(3) + 's');
    });
  }

  function isLoginShowing(){
    if (!loginOv) return false;
    if (loginOv.classList.contains('show')) return true;
    const cs = getComputedStyle(loginOv);
    return cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0';
  }

  function openMenu(){
    if (isLoginShowing()) return;
    syncUserCard();
    startAutoSync();                       // tiếp tục sync sau khi mở
    applyStagger();
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    btn.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
  }
  function closeMenu(){
    stopAutoSync();
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    btn.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
  }
  function toggleMenu(){
    overlay.classList.contains('open') ? closeMenu() : openMenu();
  }

  /* ============================================================
     5) POINTER: KÉO + TAP
     ============================================================ */
  let pointerId = null;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  let moved = false;
  const DRAG_THRESHOLD = 8;

  btn.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    pointerId = e.pointerId;
    try { btn.setPointerCapture(pointerId); } catch(err){}
    const r = btn.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = r.left; startTop = r.top;
    moved = false;
  });

  btn.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!moved){
      if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
      moved = true;
      btn.classList.add('dragging');
    }
    applyPos(startLeft + dx, startTop + dy);
  });

  function endPointer(e){
    if (e.pointerId !== pointerId) return;
    try { btn.releasePointerCapture(pointerId); } catch(err){}
    pointerId = null;

    if (moved){
      btn.classList.remove('dragging');
      const r = btn.getBoundingClientRect();
      applyPos(r.left, r.top);
      savePos();
    } else {
      toggleMenu();
    }
    moved = false;
  }
  btn.addEventListener('pointerup', endPointer);
  btn.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== pointerId) return;
    try { btn.releasePointerCapture(pointerId); } catch(err){}
    btn.classList.remove('dragging');
    pointerId = null;
    moved = false;
  });

  /* ============================================================
     6) ĐÓNG MENU
     ============================================================ */
  closeBtn.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeMenu();
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeMenu();
  });

  /* ============================================================
     7) PROXY CLICK MENU ITEM → NÚT GỐC
     ============================================================ */
  overlay.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const id = item.dataset.target;
      const real = id && document.getElementById(id);
      if (!real) return;

      if (item.animate){
        item.animate(
          [
            { transform: 'scale(1)' },
            { transform: 'scale(1.15) rotate(-3deg)', offset: .35 },
            { transform: 'scale(1)' }
          ],
          { duration: 280, easing: 'ease-out' }
        );
      }

      closeMenu();
      requestAnimationFrame(() => {
        setTimeout(() => {
          try { real.click(); } catch(e){}
        }, 220);
      });
    });
  });

  /* ============================================================
     8) AVATAR + LOGOUT trong menu
     ============================================================ */
  const menuAvatarBtn = document.getElementById('menuAvatarBtn');
  const menuLogoutBtn = document.getElementById('menuLogoutBtn');

  if (menuAvatarBtn){
    menuAvatarBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (realAvatar) realAvatar.click();
    });
  }
  if (menuLogoutBtn){
    menuLogoutBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      closeMenu();
      if (realLogout){
        requestAnimationFrame(() => {
          setTimeout(() => { try { realLogout.click(); } catch(err){} }, 220);
        });
      }
    });
  }

  /* ============================================================
     9) SYNC KHI ĐỔI AVATAR
     ============================================================ */
  if (avatarInput){
    avatarInput.addEventListener('change', () => {
      // avatar-upload.js cần thời gian upload → sync nhiều mốc
      [400, 1000, 1800, 3000].forEach(t => setTimeout(syncUserCard, t));
    });
  }

  /* ============================================================
     10) OBSERVER: LẮNG NGHE THAY ĐỔI AVATAR/LOGIN
     ============================================================ */
  if (window.MutationObserver){
    const mo = new MutationObserver(() => {
      if (overlay.classList.contains('open')) syncUserCard();
    });
    if (realLogout){
      mo.observe(realLogout, { attributes: true, attributeFilter: ['hidden', 'style', 'class'] });
    }
    if (realName){
      mo.observe(realName, { childList: true, characterData: true, subtree: true });
    }
    if (realAvatar){
      mo.observe(realAvatar, {
        attributes: true,
        attributeFilter: ['style', 'class', 'src', 'data-avatar'],
        childList: true,
        subtree: true
      });
    }
    // Observer toàn body để bắt <img class="avatar"> mới xuất hiện
    mo.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && overlay.classList.contains('open')) syncUserCard();
  });
  window.addEventListener('focus', () => {
    if (overlay.classList.contains('open')) syncUserCard();
  });

  /* ============================================================
     11) ẨN NÚT MENU KHI Ở TRANG CON (Admin / Chấm công)
     ============================================================ */
  const subPages = [
    document.getElementById('adminPage'),
    document.getElementById('attendancePage')
  ].filter(Boolean);

  function isSubPageOpen(){
    return subPages.some(el => {
      const cs = getComputedStyle(el);
      const hasOpenClass = el.classList.contains('open') || el.classList.contains('show') || el.classList.contains('active');
      return hasOpenClass || (cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity || '1') > 0.5 && cs.pointerEvents !== 'none');
    });
  }
  function refreshBtnVisibility(){
    if (isSubPageOpen() || isLoginShowing()) btn.classList.add('hidden');
    else btn.classList.remove('hidden');
  }
  refreshBtnVisibility();

  if (window.MutationObserver){
    const mo2 = new MutationObserver(refreshBtnVisibility);
    subPages.forEach(el => {
      mo2.observe(el, { attributes: true, attributeFilter: ['style', 'class'] });
    });
    if (loginOv) mo2.observe(loginOv, { attributes: true, attributeFilter: ['style', 'class'] });
  }

  /* ============================================================
     12) SYNC NGAY KHI LOAD XONG (nếu đã đăng nhập)
     ============================================================ */
  window.addEventListener('load', () => {
    syncUserCard();
    [500, 1500, 3000].forEach(t => setTimeout(syncUserCard, t));
  });

})();
</script>
